<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="surfGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#142c30"/>
      <stop offset="100%" stop-color="#081014"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#surfGrad)"/>
  <rect width="64" height="64" rx="16" stroke="#5eead4" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Glowing River Waves -->
  <g filter="url(#glow)">
    <path d="M12 24 C20 18 28 18 36 24 C44 30 52 30 56 24" stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M8 34 C18 27 28 27 38 34 C48 41 54 39 58 34" stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M12 44 C20 38 28 38 36 44 C44 50 52 50 56 44" stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Central Sentinel Node -->
  <circle cx="37" cy="34" r="5" fill="#f0fdfa"/>
  <circle cx="37" cy="34" r="9" stroke="#5eead4" stroke-width="1.8" stroke-dasharray="2 3"/>
</svg>

