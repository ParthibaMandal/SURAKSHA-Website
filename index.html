function publicNav(active){return `<header class="public-nav"><div class="nav-inner">${brand}<nav class="nav-links" id="publicLinks">${[['home','Home'],['platform','Platform'],['how-it-works','How it works'],['research','Research'],['alerts-safety','Alerts & safety'],['demo-lab','Demo lab']].map(([id,t])=>`<a href="#${id}" data-page="${id}" class="${active===id?'active':''}">${t}</a>`).join('')}</nav><div class="nav-actions"><a class="btn subtle small" data-page="login" href="#login">Sign in</a><a class="btn primary small" data-page="register" href="#register">Create account ${icon('arrow')}</a><button class="btn mobile-menu small" onclick="document.getElementById('publicLinks').classList.toggle('open')">${icon('menu')}</button></div></div></header>`}
function footer(){return `<footer class="footer"><div class="container"><div class="footer-grid"><div>${brand}<p>Connecting hydrological signals, geospatial evidence and response-oriented information for flood-risk decision support.</p><span class="pill"><i class="dot amber"></i> Research prototype</span></div><div><h4>Explore</h4><a href="#platform" data-page="platform">Platform</a><a href="#how-it-works" data-page="how-it-works">How it works</a><a href="#study-area" data-page="study-area">Study area</a><a href="#demo-lab" data-page="demo-lab">Demo lab</a></div><div><h4>Research</h4><a href="#research" data-page="research">Validation</a><a href="#methodology" data-page="methodology">Data & methodology</a><a href="#alerts-safety" data-page="alerts-safety">Alerts & safety</a><a href="#contact" data-page="contact">Collaborate</a></div><div><h4>Application</h4><a href="#login" data-page="login">Sign in</a><a href="#register" data-page="register">Create account</a><a href="#citizen-dashboard" data-page="citizen-dashboard">Citizen preview</a><a href="#admin-overview" data-page="admin-overview">Operations preview</a></div></div><div class="footer-bottom"><span>© 2026 SURAKSHA · Flood intelligence research project</span><span>Not an official emergency or government alert service.</span></div></div></footer>`}
function pageHero(kicker,title,desc,actions=''){return `<section class="page-hero"><div class="container"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p>${actions?`<div class="hero-actions">${actions}</div>`:''}</div></section>`}
function home(){return `${publicNav('home')}<main><section class="hero"><div class="container hero-grid"><div><div class="eyebrow">Flood intelligence · Decision support</div><h1>Know the rise.<br><span>Understand the risk.</span><br>Prepare the response.</h1><p class="hero-copy">SURAKSHA brings hydrological signals, geospatial evidence and response-oriented intelligence into one connected view — helping people understand what may be happening, where impacts could emerge and what deserves attention next.</p><div class="hero-actions"><a class="btn primary" href="#platform" data-page="platform">Explore the platform ${icon('arrow')}</a><a class="btn" href="#demo-lab" data-page="demo-lab">Open simulation lab ${icon('activity')}</a></div><div class="hero-meta"><span><i class="dot"></i> Flood-focused research prototype</span><span>${icon('shield')} Human-reviewed alert workflow</span><span>${icon('layers')} Evidence-led intelligence</span></div></div><div class="hero-visual"><div class="visual-head"><div><div class="visual-title">Hydrological intelligence workspace</div><div class="visual-sub">Illustrative interface · Sample values only</div></div><span class="pill"><i class="dot amber"></i> DEMO DATA</span></div><div class="map-illustration">${mapSvg()}<span class="map-label ganga">RIVER NETWORK</span><span class="map-label patna">PATNA STUDY AREA</span><span class="map-label station">GAUGE · SAMPLE</span></div><div class="metric-row"><div class="metric"><span class="label">River stage</span><strong>—</strong><small>Awaiting verified feed</small></div><div class="metric"><span class="label">Forecast status</span><strong>Demo</strong><small>Not a live forecast</small></div><div class="metric"><span class="label">Risk assessment</span><strong>—</strong><small>Not calculated</small></div></div></div></div></section>
<section class="section"><div class="container"><div class="section-head"><div><div class="eyebrow">One connected workflow</div><h2>From fragmented signals<br>to a clearer picture.</h2></div><p>Flood situations evolve quickly. SURAKSHA is designed to bring observations, modelling, geospatial context and response considerations into a traceable workflow.</p></div><div class="cards"><article class="card"><div class="card-icon">${icon('water')}</div><h3>Observe the signals</h3><p>Bring together river-stage observations, rainfall, upstream indicators and satellite evidence with visible timestamps and data-quality context.</p><a class="text-link" href="#methodology" data-page="methodology">Explore data methodology →</a></article><article class="card"><div class="card-icon">${icon('activity')}</div><h3>Assess what may follow</h3><p>Connect forecast outputs with flood-risk, inundation and exposure analysis. Keep assumptions, uncertainty and evidence visible.</p><a class="text-link" href="#platform" data-page="platform">Explore capabilities →</a></article><article class="card"><div class="card-icon">${icon('shield')}</div><h3>Support the response</h3><p>Organise incidents, draft advisories, situation reports and citizen assistance workflows under human oversight.</p><a class="text-link" href="#alerts-safety" data-page="alerts-safety">Understand alert safeguards →</a></article></div></div></section>
<section class="section"><div class="container"><div class="section-head"><div><div class="eyebrow">Event lifecycle</div><h2>One platform. Three moments.</h2></div><p>The same incident can move from preparedness to response and then recovery. The interface follows that lifecycle without confusing it with the analytical gates.</p></div><div class="phase-grid"><article class="phase"><div class="phase-number">01 / PREPARE</div><h3>Pre-event</h3><p>Monitor river and rainfall signals, review forecast scenarios, understand exposure and prepare response recommendations.</p></article><article class="phase"><div class="phase-number">02 / RESPOND</div><h3>Active event</h3><p>Track changing conditions, inspect mapped evidence, coordinate incident information and review draft alerts.</p></article><article class="phase"><div class="phase-number">03 / LEARN</div><h3>Post-event</h3><p>Compare observed impacts, document response actions, prepare reports and evaluate what the evidence supports.</p></article></div></div></section>
<section class="section"><div class="container"><div class="section-head"><div><div class="eyebrow">Scientific oversight</div><h2>Checks at every stage.</h2></div><p>Three analytical gates review the quality and consistency of pipeline execution. They are not the same thing as event phases.</p></div><div class="gate-grid"><div class="gate"><strong>01 · Pre-Run Gate</strong><p>Checks input quality, missing observations, sensor conflicts and operating conditions before model execution.</p></div><div class="gate"><strong>02 · Mid-Run Gate</strong><p>Reviews model outputs, disagreement, evidence support and whether escalation is needed.</p></div><div class="gate"><strong>03 · Post-Run Gate</strong><p>Cross-checks downstream claims against available evidence and records confidence or human-review needs.</p></div></div></div></section>
<section class="section"><div class="container split"><div><div class="eyebrow">Study context</div><h2>Grounded in the Ganga basin context.</h2><p>The initial research focus is riverine flooding around the Ganga corridor in Bihar, with the Patna area as a key study context. Upstream catchment and cryosphere signals may be explored where suitable data and validation are available.</p><div class="tag-row"><span class="tag">Ganga river system</span><span class="tag">Patna / Bihar</span><span class="tag">Upstream context</span><span class="tag">Flood-only scope</span></div><a class="btn" href="#study-area" data-page="study-area">Explore study area ${icon('arrow')}</a></div><div class="map-large">${mapSvg()}<div class="map-caption">Illustrative study-area graphic · Not a live flood map</div></div></div></section>
<section class="section"><div class="container"><div class="notice"><strong>Important:</strong> SURAKSHA is a research and decision-support prototype, not an official warning authority or emergency service. Demonstrations may use synthetic data. Forecasts and model outputs are uncertain and must not replace guidance from authorised government agencies.</div><div class="cta-band" style="margin-top:24px"><div><div class="eyebrow">Explore the workflow</div><h2>See how the system thinks about a flood event.</h2><p>Try a controlled scenario using clearly labelled synthetic inputs and outputs.</p></div><a class="btn primary" href="#demo-lab" data-page="demo-lab">Launch demo lab ${icon('arrow')}</a></div></div></section></main>${footer()}`}
function about(){return `${publicNav('about')}${pageHero('About the project','A decision-support layer for a changing river system.','SURAKSHA is an AI-assisted flood intelligence research project focused on connecting hydrological evidence, geospatial context and response workflows.')}<section class="content-section"><div class="container two-col"><div class="info-panel"><div class="eyebrow">Our purpose</div><h3>Make complex flood information easier to interpret.</h3><p>Observations, forecasts, satellite evidence and response information often live in separate systems. SURAKSHA explores how these signals can be organised into a traceable workflow that helps users understand conditions, possible consequences and where human attention is needed.</p></div><div class="info-panel"><div class="eyebrow">Current scope</div><h3>Flood-first, evidence-led development.</h3><p>The active implementation focuses on riverine flooding, especially the Ganga / Patna / Bihar study context. Upstream catchment and glacier-related indicators are research inputs where suitable sources support them. The website should not imply nationwide operational coverage.</p></div><div class="info-panel"><h3>What SURAKSHA aims to do</h3><ul><li>Organise hydrological and geospatial evidence.</li><li>Expose forecast and model uncertainty.</li><li>Connect predicted conditions with potential consequences.</li><li>Support human-reviewed advisories and incident workflows.</li></ul></div><div class="info-panel"><h3>What SURAKSHA does not claim</h3><ul><li>It is not an official government alert service.</li><li>It does not guarantee flood prediction or prevent losses.</li><li>It does not autonomously approve official warnings.</li><li>Experimental metrics are not proof of field readiness.</li></ul></div></div></section>${footer()}`}
function platform(){return `${publicNav('platform')}${pageHero('Platform capabilities','A connected view of flood intelligence.','The platform is organised around evidence intake, analytical checks, spatial understanding and response-oriented outputs. Each capability is displayed with provenance and readiness context.')}<section class="content-section"><div class="container"><div class="cards">${[['water','Hydrological ingestion','Collect and normalise station observations, rainfall and supported upstream signals.'],['activity','Forecasting committee','Compare model outputs, horizons and disagreement without hiding uncertainty.'],['map','Geospatial intelligence','Bring terrain, catchment, satellite and inundation analysis into spatial context.'],['layers','Consequence assessment','Relate potential flood extent to exposed assets and infrastructure where data exists.'],['shield','Supervisory gates','Review data quality, model execution and evidence consistency at three checkpoints.'],['file','Response intelligence','Prepare draft advisories, SITREPs and structured incident information for review.']].map(([i,t,d])=>`<article class="card"><div class="card-icon">${icon(i)}</div><h3>${t}</h3><p>${d}</p></article>`).join('')}</div><div class="notice" style="margin-top:18px">Capability availability depends on verified data sources, runtime configuration and model validation. The public website must distinguish implemented, experimental and planned modules.</div></div></section>${footer()}`}
function how(){return `${publicNav('how-it-works')}${pageHero('System workflow','Evidence in. Checks throughout. Context for action.','SURAKSHA follows a controlled analytical workflow. The AI layer can help explain validated results, but scientific calculations and alert decisions remain governed by explicit rules and authorised people.')}<section class="content-section"><div class="container"><div class="step-list">${[['01','Collect observations','Read supported river, rainfall, satellite and upstream datasets. Each record should retain source, units, timestamp and quality metadata.'],['02','Validate the operating context','Pre-Run Gate checks data quality, anomalies, sensor conflicts and degraded-mode conditions.'],['03','Run analysis','The flood pipeline executes approved forecasting, geospatial, risk and consequence modules.'],['04','Compare and challenge results','Mid-Run Gate examines model disagreement and whether claims are supported by the available evidence.'],['05','Verify the output','Post-Run Gate triangulates evidence and records confidence, limitations or a need for human review.'],['06','Prepare response information','The system can generate draft advisories and SITREPs. Publication of official alerts requires authorised approval.']].map(([n,t,d])=>`<div class="step"><div class="step-no">${n}</div><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</div><div class="notice" style="margin-top:20px">Event lifecycle (pre-event, active-event, post-event) is separate from analytical gates (Pre-Run, Mid-Run, Post-Run). The UI should show these as different dimensions.</div></div></section>${footer()}`}
function study(){return `${publicNav('study-area')}${pageHero('Study area','A focused starting point in the Ganga corridor.','The initial study context centres on riverine flood risk in Bihar, particularly around Patna. Map boundaries and station coverage shown here are illustrative until verified against the project’s configured geospatial data.')}<section class="content-section"><div class="container"><div class="map-large" style="height:430px">${mapSvg()}<div class="map-caption">Schematic only · No authoritative boundary, live gauge or flood extent</div></div><div class="two-col" style="margin-top:18px"><div class="info-panel"><h3>Primary context</h3><p>Ganga river corridor · Patna / Bihar. The operational study extent must be declared from the actual project configuration, not inferred from this illustration.</p></div><div class="info-panel"><h3>Upstream context</h3><p>Catchment, precipitation and cryosphere indicators may inform research questions. They should only appear in an operational workflow when data provenance, temporal coverage and physical relevance are documented.</p></div></div></div></section>${footer()}`}
function research(){return `${publicNav('research')}${pageHero('Research & validation','Show the evidence. Show the limits.','SURAKSHA is being developed as a research prototype. This page is designed to publish reproducible experiments, model evaluations and known limitations — not unsupported performance claims.')}<section class="content-section"><div class="container"><div class="two-col"><div class="info-panel"><h3>Evaluation principles</h3><ul><li>Record dataset name, time range and spatial coverage.</li><li>Separate training, validation and test periods.</li><li>Report baselines alongside candidate models.</li><li>Measure performance across normal and extreme regimes.</li><li>Document missing data and model failure cases.</li></ul></div><div class="info-panel"><h3>What should be published</h3><ul><li>Forecast horizon and evaluation metric definitions.</li><li>Model version, configuration and reproducibility notes.</li><li>Observed-vs-predicted plots and residual analysis.</li><li>Uncertainty, limitations and known data gaps.</li><li>Independent review status where available.</li></ul></div></div><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>Research area</th><th>Evidence to present</th><th>Publication state</th></tr></thead><tbody><tr><td>Hydrological forecasting</td><td>Time-split benchmark, horizon-wise errors, baseline comparison</td><td><span class="status warning">Needs validation</span></td></tr><tr><td>Geospatial inundation</td><td>Reference extent, resolution, spatial overlap and limitations</td><td><span class="status warning">Needs validation</span></td></tr><tr><td>Consequence assessment</td><td>Asset inventory provenance and threshold assumptions</td><td><span class="status neutral">Research workflow</span></td></tr><tr><td>Supervisory gates</td><td>Test cases, false-pass/false-stop analysis and traceability</td><td><span class="status neutral">Prototype</span></td></tr></tbody></table></div><div class="notice" style="margin-top:18px">Do not publish placeholder accuracy percentages or describe experimental model scores as operational accuracy. Every displayed metric needs a linked evaluation protocol.</div></div></section>${footer()}`}
function methodology(){return `${publicNav('methodology')}${pageHero('Data & methodology','Every signal needs a source and a timestamp.','The platform should preserve data lineage from ingestion through model output. The list below is a source-family overview, not confirmation that every integration is currently connected.')}<section class="content-section"><div class="container"><div class="table-wrap"><table><thead><tr><th>Source family</th><th>Potential use</th><th>Required metadata</th><th>Integration state</th></tr></thead><tbody><tr><td>River gauge / CWC</td><td>Stage, discharge and observed trend</td><td>Station ID, datum, units, timestamp, quality flag</td><td><span class="status warning">Verify access</span></td></tr><tr><td>IMD / rainfall sources</td><td>Observed and forecast precipitation context</td><td>Product, resolution, issue time, valid time</td><td><span class="status warning">Verify access</span></td></tr><tr><td>Copernicus ERA5-Land</td><td>Historical meteorological context</td><td>Variable, grid, time range, licence</td><td><span class="status neutral">Research dataset</span></td></tr><tr><td>GloFAS</td><td>Large-scale river discharge forecast context</td><td>Version, forecast cycle, lead time</td><td><span class="status neutral">Research dataset</span></td></tr><tr><td>Sentinel-1 SAR</td><td>Flood extent mapping under cloud cover</td><td>Acquisition time, orbit, processing chain</td><td><span class="status warning">Verify pipeline</span></td></tr><tr><td>Terrain / DEM</td><td>Topography and terrain-derived analysis</td><td>Product, resolution, vertical datum</td><td><span class="status warning">Verify dataset</span></td></tr></tbody></table></div><div class="two-col" style="margin-top:18px"><div class="info-panel"><h3>Data states</h3><p>Observed, modelled, derived, manually entered and simulated records must be visually distinct. A stale or unavailable source must never be silently shown as current.</p></div><div class="info-panel"><h3>Data lineage</h3><p>Retain source identifiers, retrieval timestamps, processing versions, units, spatial reference systems and transformation history wherever possible.</p></div></div></div></section>${footer()}`}
function alertsSafety(){return `${publicNav('alerts-safety')}${pageHero('Alerts & safety centre','Clear information. Responsible warning workflows.','SURAKSHA can organise draft recommendations and published alert records. It does not replace authorised government warning channels or emergency services.')}<section class="content-section"><div class="container"><div class="notice">The interface labels below are product UI labels for this prototype. They are not official government warning classifications. Always follow instructions from authorised local authorities.</div><div class="cards" style="margin-top:18px"><div class="card"><div class="eyebrow">01 · INFORMATION</div><h3>Advisory</h3><p>General preparedness information or a low-urgency situational update. Content must identify its source and issue time.</p></div><div class="card"><div class="eyebrow">02 · ATTENTION</div><h3>Watch</h3><p>Conditions merit closer monitoring. The interface should explain why the status is being shown and what remains uncertain.</p></div><div class="card"><div class="eyebrow">03 · ACTION</div><h3>Warning / Critical</h3><p>High-priority published messages should be issued only through an authorised workflow, with clear attribution and timestamps.</p></div></div><div class="two-col" style="margin-top:18px"><div class="info-panel"><h3>Alert lifecycle</h3><p>Draft recommendation → review → approval → publication → notification attempts → delivery evidence. These states must never be collapsed into a single “sent” label.</p></div><div class="info-panel"><h3>Accessible notification controls</h3><p>Support sound, push and vibration only where available and permissioned. Always provide persistent visual text, accessible status announcements, reduced-motion support and a way to review alert history.</p></div></div><div class="cta-band" style="margin-top:20px"><div><div class="eyebrow">Need to explore?</div><h2>Try a simulated warning flow.</h2><p>The demo is synthetic and will not send a real alert.</p></div><a class="btn primary" href="#demo-lab" data-page="demo-lab">Open demo lab ${icon('arrow')}</a></div></div></section>${footer()}`}
function demoLab(){return `${publicNav('demo-lab')}${pageHero('Interactive demo lab','Explore controlled flood scenarios.','Choose a synthetic scenario to see how a decision-support interface might organise the evidence. Every value on this page is illustrative and is not a live observation or official forecast.')}<section class="content-section"><div class="container"><div class="panel"><div class="panel-head"><div><h3>Scenario configuration</h3><small>All generated inputs are synthetic</small></div><span class="pill"><i class="dot amber"></i> SIMULATION MODE</span></div><div class="scenario-control"><div class="field"><label>Scenario</label><select id="scenarioSelect"><option value="normal">Normal river conditions</option><option value="rain">Heavy rainfall upstream</option><option value="rise">Rapid river rise</option><option value="sensor">Missing / conflicting sensor data</option><option value="satellite">Satellite unavailable</option></select></div><div class="field"><label>Study context</label><select><option>Patna / Ganga (illustrative)</option><option>Generic river reach (illustrative)</option></select></div><button class="btn primary" id="runScenario">Run synthetic scenario ${icon('arrow')}</button></div></div><div class="app-grid" style="margin-top:14px"><div class="stat-card"><div class="stat-top">River-stage input <span>${icon('water')}</span></div><div class="stat-value" id="demoStage">Normal</div><div class="stat-note">Synthetic scenario label</div></div><div class="stat-card"><div class="stat-top">Rainfall input <span>${icon('activity')}</span></div><div class="stat-value" id="demoRain">Baseline</div><div class="stat-note">Not a measured value</div></div><div class="stat-card"><div class="stat-top">Pre-Run decision <span>${icon('shield')}</span></div><div class="stat-value" id="demoGate">Pass</div><div class="stat-note">Illustrative gate response</div></div><div class="stat-card"><div class="stat-top">Review state <span>${icon('alert')}</span></div><div class="stat-value" id="demoReview">Monitor</div><div class="stat-note">Not an official warning</div></div></div><div class="two-col" style="margin-top:14px"><div class="panel"><div class="panel-head"><h3>Illustrative output</h3><span class="status warning">SYNTHETIC</span></div><p id="demoNarrative" class="muted" style="font-size:11px;line-height:1.8">Select a scenario and run the simulation. This page demonstrates interface behaviour only; it does not call the scientific backend.</p><div class="gate-cards" style="margin-top:14px"><div class="gate-status"><strong>Pre-Run</strong><p id="demoPre">Input checks are represented with sample logic.</p></div><div class="gate-status"><strong>Mid-Run</strong><p id="demoMid">Model review is represented with sample logic.</p></div><div class="gate-status"><strong>Post-Run</strong><p id="demoPost">Evidence review is represented with sample logic.</p></div></div></div><div class="panel"><div class="panel-head"><h3>Scenario response path</h3><small>Conceptual</small></div><div class="step-list"><div class="step"><div class="step-no">1</div><div><strong>Input quality</strong><p>Check data availability and sensor consistency.</p></div></div><div class="step"><div class="step-no">2</div><div><strong>Analysis</strong><p>Run forecast and spatial consequence workflow.</p></div></div><div class="step"><div class="step-no">3</div><div><strong>Human review</strong><p>Prepare an advisory draft for authorised review.</p></div></div></div></div></div><div class="notice" style="margin-top:15px">This simulation does not invoke the live SURAKSHA API, create an incident, send a notification or issue an alert.</div></div></section>${footer()}`}
function contact(){return `${publicNav('contact')}${pageHero('Contact & collaboration','Build better flood intelligence together.','For research collaboration, academic feedback or project enquiries, use the form below. This prototype form does not submit to a live service.')}<section class="content-section"><div class="container two-col"><div class="info-panel"><h3>Project collaboration</h3><p>We welcome feedback on data quality, hydrological methodology, geospatial validation, accessibility and disaster-risk communication.</p><div class="tag-row"><span class="tag">Research</span><span class="tag">Data partnerships</span><span class="tag">Academic review</span></div><p class="muted">Project status: research prototype. Contact details and institutional affiliations should be added only after they are confirmed.</p></div><div class="info-panel"><form id="contactForm"><div class="field"><label>Name</label><input required placeholder="Your name"></div><div class="field"><label>Email</label><input required type="email" placeholder="name@example.com"></div><div class="field"><label>Enquiry type</label><select><option>Research collaboration</option><option>Academic feedback</option><option>Technical question</option></select></div><div class="field"><label>Message</label><textarea required placeholder="Tell us how you'd like to collaborate..."></textarea></div><button class="btn primary full">Submit enquiry ${icon('arrow')}</button></form></div></div></section>${footer()}`}

ered your password?'} <a href="#${isReg?'login':'login'}" data-page="login">Sign in</a></div>`}</div></main>${footer()}`}

['WORKSPACE',[['admin-overview','grid','Overview'],['incidents','layers','Incidents'],['forecasts','activity','Forecasts & risk']]],

['OPERATIONS',[['stations','map','Stations & sources'],['alert-approval','bell','Alerts & approval'],['sos-management','alert','SOS management'],['sitrep','file','SITREP reports']]],
['ADMINISTRATION',[['users','users','Users & roles'],['audit-logs','file','Audit logs'],['settings','settings','System settings']]]
]:[['MY SPACE',[['citizen-dashboard','grid','Dashboard'],['locations','map','My locations'],['my-alerts','bell','My alerts'],['sos','alert','SOS assistance']]],['SUPPORT',[['safety-centre','shield','Safety centre'],['notification-settings','settings','Notifications'],['profile','users','My profile']]]];return `<aside class="sidebar" id="sidebar">${brand}${groups.map(([g,items])=>`<div class="side-label">${g}</div>${items.map(([id,ic,t])=>`<a class="side-link ${page===id?'active':''}" href="#${id}" data-page="${id}">${icon(ic)} ${t}</a>`).join('')}`).join('')}<div class="side-bottom"><a class="side-link" href="#home" data-page="home">${icon('home')} Public website</a><a class="side-link" href="#login" data-page="login">${icon('logout')} Sign out</a><div class="user-chip"><div class="avatar">${isAdmin?'AD':'CU'}</div><div><strong>${isAdmin?'Operations Admin':'Citizen Preview'}</strong><small>${isAdmin?'Administrator preview':'Citizen account preview'}</small></div></div></div></aside>`}
function appShell(page,role,body){let isAdmin=role==='admin';return `<div class="app-shell">${sidebar(page,role)}<div class="app-main"><header class="app-topbar"><div style="display:flex;align-items:center;gap:12px"><button class="top-icon mobile-sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">${icon('menu')}</button><div class="breadcrumbs">SURAKSHA <span style="color:#53605c"> / </span> <strong>${titleMap[page]}</strong></div></div><div class="top-actions"><span class="top-pill">${isAdmin?'ADMIN PREVIEW':'CITIZEN PREVIEW'}</span><button class="top-icon" title="Notifications" onclick="toast('Notification centre is a prototype view.')">${icon('bell')}</button><a class="top-icon" href="#home" data-page="home" title="Public site">${icon('home')}</a></div></header><main class="app-content">${body}</main></div></div>`}
function heading(title,desc,actions=''){return `<div class="app-heading"><div><div class="eyebrow">${title.startsWith('My')?'CITIZEN WORKSPACE':'OPERATIONS WORKSPACE'}</div><h1>${title}</h1><p>${desc}</p></div>${actions}</div>`}
function stat(label,value,note,st=''){return `<div class="stat-card"><div class="stat-top">${label}<span>${icon('activity')}</span></div><div class="stat-value">${value}</div><div class="stat-note ${st}">${note}</div></div>`}
function panel(title,content,extra=''){return `<section class="panel"><div class="panel-head"><h3>${title}</h3>${extra}</div>${content}</section>`}
function row(t,d,s,cls=''){return `<div class="list-row"><div><strong>${t}</strong><small>${d}</small></div><span class="status ${cls}">${s}</span></div>`}
function citizenDashboard(){return `${heading('My Dashboard','A personal view of saved areas, published alerts and assistance requests.',`<a class="btn primary small" href="#locations" data-page="locations">Manage locations ${icon('arrow')}</a>`)}<div class="notice" style="margin-bottom:14px">Citizen preview data is illustrative. This account is not connected to live location monitoring or notification services.</div><div class="app-grid">${stat('Saved locations','02','Patna · North zone')}${stat('Published alerts','01','Example record only','good')}${stat('Open SOS requests','00','No open requests')}${stat('Last sync','—','No live data connection')}</div><div class="app-panels">${panel('Area overview',`<div class="map-large" style="height:220px">${mapSvg()}<div class="map-caption">Illustrative location map</div></div>`,'<span class="status neutral">DEMO VIEW</span>')}${panel('Recent alert activity',`<div class="list">${row('Example advisory · Patna','Sample alert record · 06 Nov 2026','Example','warning')}${row('No other published alerts','Your alert history will appear here.','Clear','')}${row('Notification status','No delivery service connected.','Not connected','neutral')}</div>`)}</div><div class="app-panels">${panel('Your saved locations',`<div class="list">${row('Patna · Main location','Ganga corridor · illustrative','Primary','neutral')}${row('Family location','Not geocoded in this preview','Saved','')}</div>`,'<a href="#locations" data-page="locations" class="text-link">View all →</a>')}${panel('Safety quick links',`<div class="list">${row('Flood preparedness checklist','Prepare before heavy rainfall.','Guide')}${row('SOS assistance','Submit a request for help.','Open')}${row('Alert preferences','Manage optional channels.','Settings')}</div>`)}</div>`}
function locationsPage(){return `${heading('My Locations','Manage the areas you want to follow. Location subscriptions are planned and not yet connected to live monitoring.',`<button class="btn primary small" onclick="toast('Location creation is a UI prototype only.')">+ Add location</button>`)}${panel('Saved locations',`<div class="table-wrap"><table><thead><tr><th>Location</th><th>Area context</th><th>Alert subscription</th><th>State</th><th></th></tr></thead><tbody><tr><td>Patna · Main</td><td>Ganga corridor (illustrative)</td><td>Advisory, Watch, Warning</td><td><span class="status neutral">Saved</span></td><td><button class="btn small" onclick="toast('Edit location is a prototype action.')">Edit</button></td></tr><tr><td>Family location</td><td>Location not verified</td><td>Not configured</td><td><span class="status warning">Needs setup</span></td><td><button class="btn small" onclick="toast('Edit location is a prototype action.')">Edit</button></td></tr></tbody></table></div>`)}<div class="notice" style="margin-top:13px">Precise home addresses should not be collected unless essential. Store only the location detail needed to match users with relevant public alerts.</div>`}
function alertsPage(){return `${heading('My Alerts','Published alert records relevant to your saved locations. Draft recommendations are not shown as published alerts.')}${panel('Alert history',`<div class="list">${row('Example advisory · Ganga corridor','Illustrative record · Issue time not verified','Example','warning')}${row('No active verified alerts','No live authority feed is connected in this prototype.','Unavailable','neutral')}</div>`)}<div class="panel wide-panel"><div class="panel-head"><h3>Understanding alert status</h3></div><div class="gate-cards"><div class="gate-status"><strong>Draft</strong><p>Internal recommendation. Not visible as a published citizen alert.</p></div><div class="gate-status"><strong>Approved</strong><p>Reviewed by a suitably authorised person.</p></div><div class="gate-status"><strong>Published</strong><p>Released to the public through an authorised channel.</p></div></div></div>`}
function sosPage(){return `${heading('SOS Assistance','Submit a request for assistance. This prototype does not contact emergency services or dispatch responders.')}<div class="alert-banner"><span>${icon('alert')}</span><div><strong>For immediate danger, contact your local emergency services.</strong><p>Do not rely on this research prototype as an emergency response channel.</p></div></div><div class="two-col"><div class="panel"><div class="panel-head"><h3>New assistance request</h3><span class="status warning">DEMO FORM</span></div><form id="sosForm"><div class="field"><label>Type of assistance</label><select><option>Rescue / evacuation support</option><option>Medical assistance</option><option>Food / water / essentials</option><option>Other</option></select></div><div class="field"><label>Approximate location</label><input required placeholder="Area, landmark or locality"></div><div class="field"><label>People affected</label><select><option>1 person</option><option>2–5 people</option><option>6–10 people</option><option>More than 10</option><option>Not sure</option></select></div><div class="field"><label>Details</label><textarea placeholder="Describe the situation. Avoid sharing unnecessary sensitive details."></textarea></div><button class="btn primary full">Submit demo request ${icon('send')}</button></form></div><div class="panel"><div class="panel-head"><h3>My request status</h3></div><div class="empty-state"><strong>No requests in this preview</strong>Submitted requests will appear here once backend integration is available.</div><p class="muted" style="font-size:9px;line-height:1.8;margin-top:14px">SOS information is sensitive. A production service must define responder access, audit history, retention and escalation procedures.</p></div></div>`}
function safetyPage(){return `${heading('Safety Centre','Practical preparedness information for flood risk. Follow local authority instructions.') }<div class="cards"><article class="card"><div class="card-icon">${icon('home')}</div><h3>Before a flood</h3><p>Keep essential documents protected, prepare medicines and drinking water, identify safe routes and monitor authorised updates.</p></article><article class="card"><div class="card-icon">${icon('alert')}</div><h3>During a flood</h3><p>Avoid walking or driving through floodwater. Move to safer ground when instructed and keep away from electrical hazards.</p></article><article class="card"><div class="card-icon">${icon('check')}</div><h3>After a flood</h3><p>Return only when authorities say it is safe. Avoid contaminated water and damaged electrical infrastructure.</p></article></div><div class="notice" style="margin-top:15px">This page is general preparedness information, not location-specific emergency advice. Add reviewed, locally relevant guidance and authoritative references before launch.</div>`}
function notificationsPage(){return `${heading('Notification Preferences','Manage optional notification channels. Critical public safety messages may be governed by authority policy.') }<div class="panel"><div class="panel-head"><h3>Channel preferences</h3><span class="status neutral">LOCAL PREVIEW</span></div>${[['Browser push notifications','Permission-controlled browser notifications'],['Sound alerts','Optional sound after explicit user interaction'],['Vibration','Supported devices and browsers only'],['Email summaries','Account email, if configured']].map(([t,d],i)=>`<div class="list-row"><div><strong>${t}</strong><small>${d}</small></div><label style="display:flex;align-items:center;gap:7px;font-size:9px;color:#9aa7a1"><input type="checkbox" ${i===0?'checked':''}> Enabled</label></div>`).join('')}<div style="margin-top:15px"><button class="btn primary" onclick="toast('Preferences saved in the visual prototype only.')">Save preferences</button></div></div><div class="notice" style="margin-top:14px">Notification permissions depend on the browser and operating system. Do not rely on vibration or sound as the only way to communicate an alert.</div>`}
function profilePage(){return `${heading('My Profile','Manage your account details and security preferences.') }<div class="two-col"><div class="panel"><div class="panel-head"><h3>Personal information</h3></div><form id="profileForm"><div class="field"><label>Full name</label><input value="Citizen Preview"></div><div class="field"><label>Email address</label><input type="email" value="citizen@example.test" disabled></div><div class="field"><label>Preferred language</label><select><option>English</option><option>Hindi</option></select></div><button class="btn primary">Save changes</button></form></div><div class="panel"><div class="panel-head"><h3>Account security</h3></div>${row('Password','Last updated: not available','Review')}${row('Active sessions','Session list not connected','Preview')}${row('Account verification','Email verification planned','Pending','warning')}<button class="btn" style="margin-top:15px" onclick="toast('Security management is not connected.')">Manage security</button></div></div>`}
function adminOverview(){return `${heading('Operations Overview','Research operations workspace · Illustrative system state',`<span class="pill"><i class="dot amber"></i> PROTOTYPE ENVIRONMENT</span>`)}<div id="backendReadinessCard" class="alert-banner" role="status" aria-live="polite"><span>${icon('activity')}</span><div><strong>Checking SURAKSHA backend connection…</strong><p>This website only reads the backend health endpoint here. The cards below remain illustrative demo records.</p></div></div><div class="alert-banner"><span>${icon('alert')}</span><div><strong>No verified live telemetry is connected to this preview.</strong><p>Cards and records below are sample interface data. Do not interpret them as current flood conditions or operational alerts.</p></div></div><div class="app-grid">${stat('Active incidents','02','Illustrative records','good')}${stat('Stations configured','08','Catalogue count not verified')}${stat('Pipeline runs','14','Sample history')}${stat('Draft recommendations','03','Require human review','')}</div><div class="app-panels">${panel('Study-area overview',`<div class="map-large" style="height:245px">${mapSvg()}<div class="map-caption">Illustrative study-area map · Not live</div></div>`,'<span class="status warning">SAMPLE VIEW</span>')}${panel('System and data status',`<div class="list">${row('FastAPI backend','Health endpoint status appears above','Checking','warning')}${row('Hydrological ingestion','Source credentials and scheduler require verification','Unverified','warning')}${row('Geospatial pipeline','Earth Engine and asset availability require verification','Unverified','warning')}${row('Alert distribution','No authorised delivery gateway connected','Disabled','neutral')}</div>`)}</div><div class="panel wide-panel"><div class="panel-head"><h3>Analytical gate status</h3><a class="text-link" href="#pre-run" data-page="pre-run">View gates →</a></div><div class="gate-cards"><div class="gate-status"><div class="gate-top"><strong>Pre-Run</strong><span class="status warning">Sample</span></div><p>Input validation and regime assessment example.</p></div><div class="gate-status"><div class="gate-top"><strong>Mid-Run</strong><span class="status warning">Sample</span></div><p>Forecast committee and evidence review example.</p></div><div class="gate-status"><div class="gate-top"><strong>Post-Run</strong><span class="status warning">Sample</span></div><p>Cross-agent triangulation and confidence example.</p></div></div></div><div class="app-panels">${panel('Recent incident records',`<div class="list">${row('Ganga / Patna demonstration','SIM-2026-001 · Synthetic scenario','Simulation','warning')}${row('Upstream rainfall scenario','SIM-2026-002 · Synthetic scenario','Simulation','warning')}</div>`)}${panel('Pending human review',`<div class="list">${row('Draft CAP recommendation','Not published · approval required','Draft','warning')}${row('SOS triage demonstration','No real personal information','Synthetic','neutral')}</div>`)}</div>`}
function gateDetail(type){const data={
'pre-run':{name:'Pre-Run Gate',desc:'Validate input quality and operating conditions before analysis.',state:'INPUT REVIEW',checks:[['Telemetry quality','Missing values, units and timestamp checks','Review'],['Sensor consistency','Detect conflicting or implausible readings','Review'],['Data regime','Normal, rapid rise, heavy rainfall or degraded mode','Classify'],['Fallback readiness','Check approved degraded-mode strategies','Review']],decision:'CONTINUE / APPROVED FALLBACK / HUMAN REVIEW',note:'This gate can block or redirect execution when required evidence is missing or inconsistent.'},
'mid-run':{name:'Mid-Run Gate',desc:'Review forecast committee output, model disagreement and evidence support.',state:'MODEL REVIEW',checks:[['Forecast committee','Compare approved model outputs and horizons','Review'],['Model disagreement','Inspect spread and conflicting predictions','Review'],['Claim support','Check forecast and risk claims against evidence','Verify'],['Escalation','Flag disagreement or unsupported claims for review','Escalate']],decision:'CONTINUE / DISCOUNT CONFIDENCE / HUMAN ESCALATION',note:'The UI must show model version, forecast horizon, input window and disagreement metrics when the backend supplies them.'},
'post-run':{name:'Post-Run Gate',desc:'Triangulate outputs against available evidence and record confidence.',state:'EVIDENCE REVIEW',checks:[['Satellite corroboration','Compare available satellite observations and derived extent','Review'],['Forecast vs risk','Check consistency between forecast, risk and impact claims','Verify'],['External evidence','Record authoritative corroboration where supplied','Verify'],['Human approval','Require review for unresolved or high-impact claims','Required']],decision:'ACCEPT WITH CONFIDENCE / DISCOUNT / HUMAN REVIEW',note:'Post-Run Gate is not a complete post-disaster recovery management workflow; recovery case management is a separate planned feature.'}}[type];return `${heading(data.name,data.desc,`<span class="pill"><i class="dot amber"></i> ${data.state}</span>`)}<div class="app-grid">${stat('Gate execution','—','No live execution loaded')}${stat('Checks','04','Illustrative checklist')}${stat('Decision','—','Awaiting backend response')}${stat('Evidence links','—','No evidence attached')}</div><div class="app-panels">${panel('Gate checks',`<div class="list">${data.checks.map(([t,d,s])=>row(t,d,s,'warning')).join('')}</div>`)}${panel('Decision contract',`<div class="notice" style="margin-bottom:13px">${data.note}</div><div style="font-size:10px;color:#aab7b1;font-weight:650">Possible gate outcomes</div><p style="font-size:10px;color:#85928c;line-height:1.8">${data.decision}</p><button class="btn" onclick="toast('Gate execution requires a connected backend API.')">Run gate check</button>`)}</div><div class="panel wide-panel"><div class="panel-head"><h3>Execution history</h3><span class="status neutral">NO LIVE HISTORY</span></div><div class="empty-state"><strong>No gate execution loaded</strong>Connect the corresponding SURAKSHA API response to display real execution metadata, evidence references and outcomes.</div></div>`}

function updateConnectionCard(node,message,detail,kind='warning'){if(!node)return;node.className=`alert-banner ${kind==='good'?'connection-good':''}`;node.replaceChildren();const iconNode=document.createElement('span');iconNode.setAttribute('aria-hidden','true');iconNode.textContent=kind==='good'?'✓':'!';const copy=document.createElement('div');const title=document.createElement('strong');title.textContent=message;const body=document.createElement('p');body.textContent=detail;copy.append(title,body);node.append(iconNode,copy);}
async function loadBackendHealth(){const card=document.getElementById('backendReadinessCard');if(!card)return;try{const response=await fetch('/api/flood/health',{headers:{accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Backend health could not be loaded.');const blockers=Array.isArray(data.readiness_blockers)?data.readiness_blockers.length:0;const readiness=data.operational_readiness||'NOT_REPORTED';const health=data.status||'NOT_REPORTED';updateConnectionCard(card,`SURAKSHA API reachable · health ${health}`,`Operational readiness: ${readiness}. ${blockers} readiness limitation(s) reported. Health is not proof of fresh observations or production readiness.`,health==='HEALTHY'?'good':'warning');}catch(error){updateConnectionCard(card,'SURAKSHA API unavailable',error.message||'Configure the backend URL in the website server to load its health status.','warning');}}
async function loadBackendScenarios(){const select=document.getElementById('scenarioSelect');if(!select)return;if(!window.localScenarioOptions)window.localScenarioOptions=[...select.options].map(option=>({value:option.value,label:option.textContent}));let note=document.getElementById('demoBackendStatus');if(!note){note=document.createElement('div');note.id='demoBackendStatus';note.className='notice';note.setAttribute('role','status');note.setAttribute('aria-live','polite');const control=select.closest('.panel');control?.after(note);}note.textContent='Checking for the backend synthetic scenario catalog…';try{const response=await fetch('/api/flood/demo/scenarios',{headers:{accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Backend scenario catalog unavailable.');const scenarios=Array.isArray(data.scenarios)?data.scenarios:[];if(!scenarios.length)throw new Error('The backend returned no synthetic scenarios.');window.surakshaDemoScenarioIndex=Object.fromEntries(scenarios.filter(item=>item?.id).map(item=>[item.id,item]));select.replaceChildren(...scenarios.filter(item=>item?.id).map(item=>{const option=document.createElement('option');option.value=item.id;option.textContent=item.name||item.id;return option;}));if(!document.getElementById('demoExecutionMode')){const field=document.createElement('div');field.className='field';const label=document.createElement('label');label.htmlFor='demoExecutionMode';label.textContent='Pipeline mode';const mode=document.createElement('select');mode.id='demoExecutionMode';for(const [value,name] of [['supervised','Jev-supervised pipeline'],['static','Static baseline']]){const option=document.createElement('option');option.value=value;option.textContent=name;mode.append(option);}field.append(label,mode);select.closest('.scenario-control')?.insertBefore(field,document.getElementById('runScenario'));}note.textContent=`Backend scenario catalog connected (${scenarios.length} synthetic scenarios). Scenario execution uses the backend's deterministic offline Jev simulator; outputs are research demonstrations.`;}catch(error){window.surakshaDemoScenarioIndex=null;select.replaceChildren(...window.localScenarioOptions.map(item=>{const option=document.createElement('option');option.value=item.value;option.textContent=item.label;return option;}));note.textContent=`Backend scenario catalog unavailable: ${error.message||'Configure the backend URL in the website server.'} The local interface scenarios remain available as frontend-only examples.`;}}
function formatMetric(value,unit=''){return typeof value==='number'&&Number.isFinite(value)?`${value.toFixed(2)}${unit}`:'not returned'}
function gateSummary(history,gate){const matching=(Array.isArray(history)?history:[]).filter(item=>String(item.gate||'').toUpperCase().includes(gate));if(!matching.length)return 'No explicit gate event was included in this run record.';return matching.map(item=>[item.action||item.verdict||item.decision,(Array.isArray(item.reasons)?item.reasons.join('; '):typeof item.reasons==='string'?item.reasons:null)].filter(Boolean).join(' — ')||'Gate event recorded').join(' · ')}
async function runBackendDemoScenario(scenarioId){const button=document.getElementById('runScenario');const note=document.getElementById('demoBackendStatus');const mode=document.getElementById('demoExecutionMode')?.value||'supervised';if(button){button.disabled=true;button.textContent='Running synthetic pipeline…';}if(note)note.textContent='Running the selected synthetic scenario through the SURAKSHA backend. This may take a few seconds.';try{const response=await fetch(`/api/flood/demo/scenarios/${encodeURIComponent(scenarioId)}/run?mode=${encodeURIComponent(mode)}`,{method:'POST',headers:{accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'The backend scenario run failed.');const state=data.result||{};const condition=state.current_condition||{};const forecast=state.forecast||{};const risk=state.risk_assessment||{};const history=state.supervisor?.action_history||[];const forecasts=[['+6 h',forecast.t_plus_6],['+12 h',forecast.t_plus_12],['+24 h',forecast.t_plus_24]].filter(([,value])=>typeof value==='number').map(([horizon,value])=>`${horizon} ${formatMetric(value,' m')}`).join(' · ')||'Forecast horizons not returned';const riskText=[risk.severity?`Severity ${risk.severity}`:null,typeof risk.risk_score==='number'?`risk score ${formatMetric(risk.risk_score)}`:null,typeof state.impact_assessment?.affected_area_km2==='number'?`affected area ${formatMetric(state.impact_assessment.affected_area_km2,' km²')}`:null].filter(Boolean).join(' · ')||'Risk summary not returned';document.getElementById('demoStage').textContent=formatMetric(condition.water_level_m,' m');document.getElementById('demoRain').textContent=formatMetric(condition.rainfall_24h_mm,' mm');document.getElementById('demoGate').textContent='Pipeline completed';document.getElementById('demoReview').textContent=data.human_review_request?.status||'No review request returned';document.getElementById('demoNarrative').textContent=`${data.scenario_name||scenarioId} · ${data.synthetic_data_only?'SYNTHETIC DATA ONLY':'Provenance not reported'} · Jev: ${data.jev_mode||'mode not reported'} · ${forecasts} · ${riskText}. These are backend pipeline outputs for research review, not an official flood warning.`;document.getElementById('demoPre').textContent=gateSummary(history,'PRE_RUN');document.getElementById('demoMid').textContent=gateSummary(history,'MID_RUN');document.getElementById('demoPost').textContent=gateSummary(history,'POST_RUN');const output=document.getElementById('demoBackendRunRecord');if(output)output.textContent=JSON.stringify(data,null,2);else{const panel=document.querySelector('#root .two-col .panel');if(panel){const details=document.createElement('details');details.id='demoBackendRunRecordDetails';details.className='run-record';const summary=document.createElement('summary');summary.textContent='Inspect full backend run record';const pre=document.createElement('pre');pre.id='demoBackendRunRecord';details.append(summary,pre);panel.append(details);pre.textContent=JSON.stringify(data,null,2);}}if(note)note.textContent=`Backend pipeline run complete · ${data.event_id||'run ID not returned'} · ${data.mode||mode} · Synthetic data only · Jev offline deterministic simulator.`;toast('Backend synthetic pipeline run completed.');}catch(error){if(note)note.textContent=`Backend scenario run unavailable: ${error.message||'Check the local demo server and backend configuration.'} The frontend-only example has not been presented as a backend result.`;toast('Backend scenario run did not complete.');}finally{if(button){button.disabled=false;button.innerHTML=`Run synthetic scenario ${icon('arrow')}`;}}}
function addCell(row,value){const cell=document.createElement('td');cell.textContent=value==null||value===''?'—':String(value);row.append(cell);}
async function loadBackendStations(){const content=document.querySelector('.app-content');if(!content)return;let notice=document.getElementById('backendStationsNotice');if(!notice){notice=document.createElement('div');notice.id='backendStationsNotice';notice.className='notice';notice.setAttribute('role','status');notice.setAttribute('aria-live','polite');const catalog=[...content.querySelectorAll('.panel')].find(panel=>panel.querySelector('h3')?.textContent.trim()==='Station catalogue');if(catalog)catalog.before(notice);else content.prepend(notice);}notice.textContent='Loading station metadata from the SURAKSHA API. Catalog metadata does not indicate whether a live feed is connected.';try{const response=await fetch('/api/flood/stations',{headers:{accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'Station catalog could not be loaded.');if(!Array.isArray(data))throw new Error('The backend returned an unexpected station catalog.');const catalog=[...content.querySelectorAll('.panel')].find(panel=>panel.querySelector('h3')?.textContent.trim()==='Station catalogue');const headers=catalog?.querySelectorAll('thead th');['Station','River / basin','State / district','Coordinates','Feed freshness'].forEach((label,index)=>{if(headers?.[index])headers[index].textContent=label;});const body=catalog?.querySelector('tbody');if(body){body.replaceChildren();for(const station of data){const row=document.createElement('tr');addCell(row,station.station_name||station.station_id);addCell(row,station.river||station.basin);addCell(row,station.state||station.district);const hasCoordinates=station.latitude!=null&&station.longitude!=null&&Number.isFinite(Number(station.latitude))&&Number.isFinite(Number(station.longitude));addCell(row,hasCoordinates?`${station.latitude}, ${station.longitude}`:'Not provided');addCell(row,'Not reported by station catalog');body.append(row);}if(data.length===0){const row=document.createElement('tr');const cell=document.createElement('td');cell.colSpan=5;cell.textContent='No stations are available in the backend catalog.';row.append(cell);body.append(row);}}const statValue=content.querySelector('.stat-card .stat-value');if(statValue)statValue.textContent=String(data.length);const statNote=content.querySelector('.stat-card .stat-note');if(statNote)statNote.textContent='Records from connected API';notice.textContent=`Loaded ${data.length} station catalog record(s) from the SURAKSHA API. This is station metadata only; feed status and observation freshness are not implied.`;}catch(error){notice.textContent=`SURAKSHA station catalog unavailable: ${error.message||'Configure the backend URL in the website server.'}`;}}

window.addEventListener('hashchange',render);document.addEventListener('click',e=>{const link=e.target.closest('[data-page]');if(link){e.preventDefault();const next=link.getAttribute('data-page');if(location.hash==='#'+next){render()}else location.hash=next;}});
document.addEventListener('submit',e=>{if(['authForm','contactForm','sosForm','profileForm'].includes(e.target.id)){e.preventDefault();if(e.target.id==='authForm'){const page=(location.hash||'#login').slice(1);if(page==='login'){toast('Demo sign-in complete. Opening citizen preview.');location.hash='citizen-dashboard'}else if(page==='register'){toast('Registration UI preview only. No account was created.');location.hash='login'}else toast('Password reset is not connected to an email service.');}else if(e.target.id==='contactForm'){toast('Enquiry form preview only — no message was sent.');e.target.reset()}else if(e.target.id==='sosForm'){toast('Demo SOS form only — no emergency request was sent.');e.target.reset()}else toast('Profile changes are not saved in this preview.');}});
document.addEventListener('click',e=>{if(e.target.closest('#runScenario')){const s=document.getElementById('scenarioSelect')?.value;if(window.surakshaDemoScenarioIndex?.[s]){runBackendDemoScenario(s);return;}const d={normal:{stage:'Normal',rain:'Baseline',gate:'Pass',review:'Monitor',n:'Baseline scenario: inputs appear internally consistent in this illustrative example. No flood forecast or risk score is generated.',pre:'Input completeness check: sample pass.',mid:'No model disagreement represented.',post:'Evidence review represented as complete.'},rain:{stage:'Rising',rain:'Elevated',gate:'Pass',review:'Review',n:'Heavy rainfall scenario: additional upstream observations and forecast context would be needed. The interface flags the need to inspect changing conditions and downstream exposure.',pre:'Input timestamps and source coverage should be checked.',mid:'Compare rainfall and flow response across model runs.',post:'Check whether mapped extent and forecast claims are corroborated.'},rise:{stage:'Rapid rise',rain:'Elevated',gate:'Review',review:'Escalate',n:'Rapid river-rise scenario: the analytical workflow should prioritise rate-of-rise checks, station quality, forecast spread and potential exposure. This sample does not calculate a real risk level.',pre:'Review rapid-rise regime and sensor validity.',mid:'Inspect forecast disagreement and lead time.',post:'Require evidence triangulation and human review.'},sensor:{stage:'Conflicting',rain:'Unknown',gate:'Hold',review:'Human review',n:'Sensor conflict scenario: pipeline execution may need to pause or use an approved fallback. Conflicting observations must not be averaged away without a justified rule.',pre:'Flag missing or conflicting telemetry.',mid:'Avoid unverified model inputs; inspect fallback eligibility.',post:'Discount confidence and escalate unresolved conflicts.'},satellite:{stage:'Unknown',rain:'Baseline',gate:'Degraded',review:'Limited evidence',n:'Satellite unavailable scenario: the workflow should disclose the missing evidence source, evaluate supported alternatives and avoid implying that inundation mapping is current.',pre:'Mark satellite source unavailable.',mid:'Proceed only with approved alternative evidence.',post:'Document spatial evidence limitation.'}}[s];document.getElementById('demoStage').textContent=d.stage;document.getElementById('demoRain').textContent=d.rain;document.getElementById('demoGate').textContent=d.gate;document.getElementById('demoReview').textContent=d.review;document.getElementById('demoNarrative').textContent=d.n;document.getElementById('demoPre').textContent=d.pre;document.getElementById('demoMid').textContent=d.mid;document.getElementById('demoPost').textContent=d.post;toast('Frontend-only synthetic example rendered. No backend was called.');}
if(e.target.id==='approveDemo'){document.getElementById('approvalStatus').textContent='APPROVED · LOCAL DEMO';document.getElementById('approvalStatus').className='status';toast('Local demo state updated. Nothing was published.');}
if(e.target.id==='rejectDemo'){document.getElementById('approvalStatus').textContent='REJECTED · LOCAL DEMO';document.getElementById('approvalStatus').className='status critical';toast('Local demo state updated. Nothing was rejected in the backend.');}});
render();
</script>
</body>
</html>
